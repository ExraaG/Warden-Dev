services:
  warden:
    image: warden:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warden
    restart: unless-stopped
    ports:
      - "22313:22313"                 # Warden Web UI
      - "25601-25700:25601-25700"     # Warden Minecraft server port range (TCP)
      - "25601-25700:25601-25700/udp" # Warden Minecraft server port range (UDP)
    environment:
      - PORT=22313
      - TZ=${TZ:-Europe/Vienna}
      - WARDEN_API_KEY=${WARDEN_API_KEY:-warden_secret_key_change_me}
      - DATA_DIR=/data
      - DEV_FIXTURE_MODE=${DEV_FIXTURE_MODE:-false}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:22313/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
