services:
  warden:
    image: warden:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warden
    restart: unless-stopped
    ports:
      - "22313:22313"                 # Warden Web UI
      - "25565:25565"                 # Default Minecraft Java (TCP)
      - "25565:25565/udp"             # Default Minecraft Java (UDP)
      - "25500-25600:25500-25600"     # Dynamic Minecraft server port range (TCP)
      - "25500-25600:25500-25600/udp" # Dynamic Minecraft server port range (UDP)
      - "19132:19132/udp"             # Bedrock Edition (UDP)
      - "8123:8123"                   # Dynmap / BlueMap (TCP)
    environment:
      - PORT=22313
      - TZ=${TZ:-Europe/Vienna}
      - WARDEN_API_KEY=${WARDEN_API_KEY:-warden_secret_key_change_me}
      - DATA_DIR=/data
      - DEV_FIXTURE_MODE=${DEV_FIXTURE_MODE:-false}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:22313/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
